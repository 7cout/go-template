syntax = "proto3";

package item.v1;

option go_package = "github.com/7cout/go-template/gen/item/v1;itemv1";

// ItemService is an example gRPC contract. Generation is not wired in yet:
// add buf.gen.yaml with protoc-gen-go / protoc-gen-go-grpc when needed.
service ItemService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
}

message Item {
  int64 id = 1;
  string name = 2;
}

message CreateItemRequest {
  string name = 1;
}

message CreateItemResponse {
  Item item = 1;
}

message GetItemRequest {
  int64 id = 1;
}

message GetItemResponse {
  Item item = 1;
}
